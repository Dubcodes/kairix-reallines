[Unit]
# Never start Uvicorn with a second UART reader or without a live owner.
BindsTo=kairix-reallines-tracking.service
After=kairix-reallines-tracking.service
PartOf=kairix-reallines-tracking.service

[Service]
Environment=KAIRIX_PICO_OWNER_SOCKET=/run/kairix-reallines/owner.sock
Environment=KAIRIX_TRACKING_MMAP_PATH=/dev/shm/kairix-reallines-tracking-v1
