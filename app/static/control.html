<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kairix RealLines — Control</title><link rel="stylesheet" href="/static/css/common.css"></head>
<body data-page="control"><header><div><h1>Graphics Control</h1><div class="small">Scene editor · changes are live on /gfx</div></div><span id="status" class="status-ok"></span></header>
<div class="layout-bar"><label>Layout <select id="layoutSelect"></select></label><span id="layoutState" class="layout-state">SAVED</span><button id="saveLayout">Save</button><button id="saveAsLayout">Save As</button><button id="newLayout">New</button><button id="renameLayout">Rename</button><button id="duplicateLayout">Duplicate</button><button id="deleteLayout" class="danger subtle">Delete</button></div>
<div class="sync-bar"><strong>Graphics sync</strong><label>Delay <input id="graphicsDelay" type="number" min="0" max="2000" step="1" value="0"> ms</label><div class="sync-steps"><button data-delay-step="-100">−100</button><button data-delay-step="-10">−10</button><button data-delay-step="-1">−1</button><button data-delay-step="1">+1</button><button data-delay-step="10">+10</button><button data-delay-step="100">+100</button></div><button id="resetDelay">Reset 0</button><span id="syncStatus" class="small">—</span></div>
<main class="control-layout">
<section class="panel layers-panel"><h2>Layers</h2><div class="row compact-actions"><button id="addLine">+ Line</button><button id="addText">+ Text</button><button id="addMarker">+ Marker</button><button id="addGroup">+ Group</button></div><div id="items" class="scene-list"></div></section>
<section class="panel viewport-panel"><div class="editor-toolbar" aria-label="Editor viewport controls">
  <div class="tool-group"><span class="tool-label">View</span><button id="cameraView" class="active">Camera</button><button id="topView">Top Down</button></div>
  <button id="fitAll">Fit All</button><button id="fitSelection">Fit Selection</button>
  <label class="tool-check"><input id="showGrid" type="checkbox" checked> Show Grid</label>
  <label class="tool-select">Snap <select id="snap"><option value="0">Off</option><option value="0.1">0.1 m</option><option value="0.5">0.5 m</option><option value="1">1.0 m</option></select></label>
</div><div id="viewportWrap" class="viewport-wrap"><canvas id="preview" class="preview editor-canvas" tabindex="0"></canvas><div id="viewBadge" class="view-badge">CAMERA</div></div><div id="viewportHelp" class="small editor-help">Click an object to select it. Drag objects or line endpoints to position them.</div></section>
<section class="panel properties-panel"><h2>Properties</h2><div id="props"><span class="small">Select a layer.</span></div><hr><div class="row"><label>GFX background</label><input id="background" type="color"></div></section>
</main>
<dialog id="editorDialog"><form method="dialog"><h2 id="dialogTitle"></h2><p id="dialogMessage" class="small"></p><input id="dialogInput" type="text"><label id="dialogOptionWrap" class="dialog-option"><input id="dialogOption" type="checkbox"><span id="dialogOptionLabel"></span></label><div class="row dialog-actions"><button id="dialogCancel" type="button">Cancel</button><button id="dialogAccept" value="accept" class="primary">OK</button></div></form></dialog>
<script type="module" src="/static/js/control.js?v=sync1"></script></body></html>
