name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/editor_math.test.mjs
      - run: node --test tests/frontend_contract.test.mjs
      - name: Syntax-check operator JavaScript
        run: |
          node --check app/static/js/common.js
          node --check app/static/js/engineering.js
          node --check app/static/js/engineering_contract.js
          node --check app/static/js/calibration.js
          node --check app/static/js/calibration_contract.js
          node --check app/static/js/dot_lock.js
          node --check app/static/js/dot_calibration_ui.js
          node --check app/static/js/control.js
          node --check app/static/js/editor.js
          node --check app/static/js/preview.js
          node --check app/static/js/preview_media.js
          node --check app/static/js/render.js
          node --check app/static/js/pose_order.js
      - run: python -m compileall -q app tests

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native renderer build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev
      - name: Build native core and SDL2 renderer
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON && cmake --build native/build --parallel
      - name: Run native projection and timing tests
        run: ctest --test-dir native/build --output-on-failure
      - name: Validate service and installer syntax
        run: bash -n installer/install-native-renderer.sh && python -m py_compile installer/kairix-native-helper
